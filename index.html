<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Hoja de estilos --> 
        <link rel="stylesheet" href="./src/css/style.css">

        <!-- icono de la pokebola -->
        <link rel="icon" type="image/svg" href="./icon/pokebola.svg">
        <title>Pokedex</title>
    </head>
    <body>
        <div class="card">
            <div class="card-container">
                <h1 id="pokemon-name"></h1>
                <p id="pokemon-id"></p>
                <img src="" alt="pokemon" id="pokemon-img">
                <div class="types"></div> 
            </div>
            <div class="button">
                <button class="prev">Anterior</button>
                <button class="next">Siguiente</button>
            </div>
        </div>

        <div id="pokemon-modal" class="modal hidden">
            <div class="modal-content">
                <span id="close-modal">&times;</span>
                <h2 id="modal-name"></h2>
                <img id="modal-img" src="" alt="pokemon grande">

                <p id="modal-id" class="pokemon-id"></p>

                <div class="modal-info">
                    <p><strong>Altura: </strong><span id="modal-height"></span></p>
                    <p><strong>Peso: </strong><span id="modal-weight"></span></p>
                    <p><strong>Habilidades: </strong><span id="modal-abilities"></span></p>
                </div>
                <div id="modal-stats" class="modal-stats"></div>
            </div> 
        </div> 

        <script type="module" src="./src/main.js"></script>
    </body>
</html>
